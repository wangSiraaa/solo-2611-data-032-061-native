[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deworkbench"
version = "1.0.0"
description = "Reproducible bulk count-matrix differential-expression workbench for synthetic data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.scripts]
deworkbench = "deworkbench.cli:main"

[tool.setuptools.packages.find]
include = ["deworkbench*"]
